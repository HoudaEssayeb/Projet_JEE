spring.application.name=demo

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/mini_projet_jee
spring.datasource.username=postgres
spring.datasource.password=admin

# JPA - Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Pour eviter les prob affichage des logs
logging.level.org.springframework.security=DEBUG

spring.jpa.properties.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.hibernate.orm.results=DEBUG