<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Connexion - E-Shop JEE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">

            <div th:if="${param.registerSuccess}" class="alert alert-success alert-dismissible fade show" role="alert">
                <strong>Succès !</strong> Votre compte a été créé. Vous pouvez maintenant vous connecter.
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <strong>Erreur !</strong> Identifiants ou mot de passe incorrects.
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div th:if="${param.logout}" class="alert alert-info alert-dismissible fade show" role="alert">
                Vous avez été déconnecté avec succès.
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div class="card shadow border-0 mt-3">
                <div class="card-header bg-dark text-white text-center py-3">
                    <h4 class="m-0">Connexion - E-Shop JEE</h4>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/login}" method="post">

                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold">Nom d'utilisateur</label>
                            <input type="text" id="username" name="username" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label fw-semibold">Mot de passe</label>
                            <input type="password" id="password" name="password" class="form-control" required>
                        </div>

                        <button type="submit" class="btn btn-success w-100 fw-bold py-2 mt-2">
                            Se connecter
                        </button>
                    </form>

                    <hr class="my-4">

                    <div class="text-center">
                        <p class="mb-0 text-muted">Nouveau sur la plateforme ?</p>
                        <a th:href="@{/register}" class="text-primary fw-bold text-decoration-none">Créer un compte client</a>
                    </div>


                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
