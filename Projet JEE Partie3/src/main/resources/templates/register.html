<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Créer un compte</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5" style="max-width: 500px;">
    <div class="card shadow-sm border-0 bg-white p-4">
        <h3 class="text-center mb-4">Créer un compte</h3>

        <form th:action="@{/register}" th:object="${user}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">Nom d'utilisateur</label>
                <input type="text" th:field="*{username}" id="username" class="form-control" required placeholder="Ex: amine_22">
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Mot de passe</label>
                <input type="password" th:field="*{password}" id="password" class="form-control" required placeholder="********">
            </div>

            <button type="submit" class="btn btn-primary w-100 fw-bold mt-2">S'inscrire</button>
        </form>

        <hr class="my-4">
        <div class="text-center">
            <p class="mb-0 text-muted">Déjà un compte ? <a th:href="@{/login}" class="fw-semibold">Se connecter</a></p>
        </div>
    </div>
</div>

</body>
</html>
