<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Gestion des Articles</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{_navbar :: navbar}"></div>
<div class="container mt-5">
    <div class="d-flex justify-content-between align-content-center mb-4">
        <h2>Catalogue des Articles</h2>
        <div>
            <!-- Bouton visible uniquement par l'ADMIN -->
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/articles/nouveau}" class="btn btn-primary">Ajouter un Article</a>
          </div>
    </div>

    <!-- Formulaire de recherche multicritère -->
    <div class="card mb-4 shadow-sm">
        <div class="card-body">
            <form th:action="@{/articles}" method="get" class="row g-3">
                <div class="col-md-5">
                    <input type="text" name="motCle" th:value="${motCle}" class="form-control" placeholder="Rechercher par description...">
                </div>
                <div class="col-md-4">
                    <input type="number" name="prixMax" th:value="${prixMax}" class="form-control" placeholder="Prix maximum (DH)..." step="0.01">
                </div>
                <div class="col-md-3 d-grid">
                    <button type="submit" class="btn btn-secondary">Filtrer</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Grille des Articles de type E-Commerce -->
    <div class="row row-cols-1 row-cols-md-3 g-4">
        <div class="col" th:each="art : ${articles}">
            <div class="card h-100 shadow-sm border-0">
                <!-- Badge de Stock -->
                <div class="position-absolute top-0 end-0 p-2">
                <span th:text="${art.quantiteStock > 0 ? 'En Stock: ' + art.quantiteStock : 'Rupture'}"
                      th:class="${art.quantiteStock == 0} ? 'badge bg-danger' : 'badge bg-success'">0</span>
                </div>

                <div class="card-body pt-4">
                    <h5 class="card-title fw-bold text-dark" th:text="${art.description}">Nom de l'article</h5>
                    <h4 class="text-primary my-3" th:text="${art.prix} + ' DH'">0 DH</h4>
                    <p class="card-text text-muted small">
                        Expire le : <span th:text="${art.dateExpiration != null ? art.dateExpiration : 'N/A'}"></span>
                    </p>
                </div>

                <div class="card-footer bg-white border-0 d-flex justify-content-between align-items-center pb-3">
                    <!-- CORRECTION Actions Client : Visible UNIQUEMENT par un USER et si le stock > 0 -->
                    <form th:action="@{/panier/ajouter}" method="post" class="w-100 me-2"
                          sec:authorize="hasRole('USER')" th:if="${art.quantiteStock > 0}">
                        <input type="hidden" name="articleId" th:value="${art.id}">
                        <div class="input-group input-group-sm">
                            <!-- Le th:max garantit qu'on ne peut pas commander plus que la quantité disponible -->
                            <input type="number" name="quantite" value="1" min="1" th:max="${art.quantiteStock}" class="form-control" style="max-width: 60px;">
                            <div th:if="${param.error == 'stock_insuffisant'}" class="alert alert-danger alert-dismissible fade show" role="alert">
                                Quantité demandée supérieure au stock disponible !
                            </div>
                            <button type="submit" class="btn btn-success btn-sm">Ajouter</button>
                        </div>
                    </form>

                    <!-- Actions ADMIN : Modifier / Supprimer -->
                    <div sec:authorize="hasRole('ADMIN')" class="btn-group btn-group-sm ms-auto">
                        <a th:href="@{/articles/modifier/{id}(id=${art.id})}" class="btn btn-warning">Modifier</a>
                        <a th:href="@{/articles/supprimer/{id}(id=${art.id})}" class="btn btn-danger" onclick="return confirm('Supprimer ?')">Supprimer</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Message si recherche vide -->
    <div th:if="${#lists.isEmpty(articles)}" class="text-center text-muted my-5">
        <h5>Aucun article disponible pour cette recherche.</h5>
    </div>

</div>
</body>
</html>
