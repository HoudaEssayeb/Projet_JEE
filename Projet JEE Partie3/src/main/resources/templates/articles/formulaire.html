<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulaire Article</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5" style="max-width: 600px;">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0" th:text="${article.id == null} ? 'Créer un Nouvel Article' : 'Modifier l\'Article'">Formulaire</h4>
        </div>
        <div class="card-body p-4">
            <form th:action="@{/articles/enregistrer}" th:object="${article}" method="post">
                <!-- ID caché indispensable pour la modification -->
                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label class="form-label">Description / Nom de l'article</label>
                    <input type="text" th:field="*{description}" class="form-control" required placeholder="Nom Article">
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Prix (DH)</label>
                        <input type="number" th:field="*{prix}" class="form-control" step="0.01" min="0" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Quantité en Stock</label>
                        <input type="number" th:field="*{quantiteStock}" class="form-control" min="0" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label">Date d'expiration (Optionnelle)</label>
                    <input type="date" th:field="*{dateExpiration}" class="form-control">
                </div>

                <div class="d-flex justify-content-between">
                    <a th:href="@{/articles}" class="btn btn-secondary">Annuler</a>
                    <button type="submit" class="btn btn-success" th:text="${article.id == null} ? 'Enregistrer' : 'Mettre à jour'">Valider</button>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
