<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Modifier Utilisateur (Admin)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{_navbar :: navbar}"></div>

<div class="container mt-5" style="max-width: 600px;">
    <div class="card shadow border-0">
        <div class="card-header bg-warning text-dark py-3">
            <h4 class="mb-0 fw-bold"> Modifier le compte de : <span th:text="${user.username}"></span></h4>
        </div>
        <div class="card-body p-4">
            <form th:action="@{/admin/users/modifier}" th:object="${user}" method="post">

                <input type="hidden" th:field="*{id}">

                <!-- username MODIFIABLE -->
                <div class="mb-3">
                    <label>Username</label>
                    <input type="text" th:field="*{username}" class="form-control">
                </div>

                <!-- nouveau password -->
                <div class="mb-3">
                    <label>Nouveau mot de passe (optionnel)</label>
                    <input type="password" name="newPassword" class="form-control">
                </div>

                <div class="mb-3">
                    <label>Nom complet</label>
                    <input type="text" th:field="*{nomComplet}" class="form-control">
                </div>

                <div class="mb-3">
                    <label>Adresse</label>
                    <textarea th:field="*{adresseLivraison}" class="form-control"></textarea>
                </div>

                <div class="mb-3">
                    <label>Téléphone</label>
                    <input type="text" th:field="*{telephone}" class="form-control">
                </div>

                <div class="mb-3">
                    <label>Rôle</label>
                    <select th:field="*{role}" class="form-select">
                        <option value="USER">USER</option>
                        <option value="ADMIN">ADMIN</option>
                    </select>
                </div>

                <button class="btn btn-success">Enregistrer</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
