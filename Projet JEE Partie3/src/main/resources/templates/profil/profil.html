<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mon Profil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{_navbar :: navbar}"></div>

<div class="container mt-5" style="max-width: 600px;">
    <!-- Message de succès après enregistrement -->
    <div th:if="${param.success}" class="alert alert-success alert-dismissible fade show" role="alert">
        Profil mis à jour avec succès !
    </div>

    <div class="card shadow border-0">
        <div class="card-header bg-dark text-white py-3">
            <h4 class="mb-0"> Mon Profil Utilisateur</h4>
        </div>
        <div class="card-body p-4">
            <form th:action="@{/profil/enregistrer}" th:object="${user}" method="post">

                <!-- Identifiant (Non modifiable) -->
                <div class="mb-3">
                    <label class="form-label fw-bold text-muted">Nom d'utilisateur (Identifiant)</label>
                    <input type="text" th:field="*{username}" class="form-control bg-secondary-subtle" readonly>
                </div>

                <!-- Nom Complet -->
                <div class="mb-3">
                    <label class="form-label fw-bold">Nom Complet</label>
                    <input type="text" th:field="*{nomComplet}" class="form-control" placeholder="Prenom et Nom" autocomplete="name">
                </div>

                <!-- Adresse de livraison -->
                <div class="mb-3">
                    <label class="form-label fw-bold">Adresse de livraison par défaut</label>
                    <textarea th:field="*{adresseLivraison}" class="form-control" rows="3" placeholder="Votre adresse complète pour les colis..." autocomplete="street-address"></textarea>
                </div>

                <!-- Téléphone -->
                <div class="mb-4">
                    <label class="form-label fw-bold">Numéro de Téléphone</label>
                    <input type="tel" th:field="*{telephone}" class="form-control" placeholder="Téléphone" autocomplete="tel">
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-success">Enregistrer les modifications</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
