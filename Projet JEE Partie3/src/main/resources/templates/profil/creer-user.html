<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Administration - Créer un Utilisateur</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{_navbar :: navbar}"></div>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">

            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="text-dark fw-bold">Ajouter un Nouvel Utilisateur</h2>
                <a th:href="@{/admin/users}" class="btn btn-secondary">Retour à la liste</a>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <form th:action="@{/admin/users/creer}" th:object="${user}" method="post">

                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}" />

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="username" class="form-label fw-semibold">
                                    Nom d'utilisateur
                                </label>

                                <input type="text"
                                       id="username"
                                       th:field="*{username}"
                                       class="form-control"
                                       required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="password" class="form-label fw-semibold">
                                    Mot de passe
                                </label>

                                <input type="password"
                                       id="password"
                                       th:field="*{password}"
                                       class="form-control"
                                       required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="nomComplet" class="form-label fw-semibold">
                                Nom complet
                            </label>

                            <input type="text"
                                   id="nomComplet"
                                   th:field="*{nomComplet}"
                                   class="form-control">
                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">
                                <label for="telephone" class="form-label fw-semibold">
                                    Téléphone
                                </label>

                                <input type="text"
                                       id="telephone"
                                       th:field="*{telephone}"
                                       class="form-control">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="role" class="form-label fw-semibold">
                                    Rôle
                                </label>

                                <select id="role"
                                        th:field="*{role}"
                                        class="form-select">

                                    <option value="USER">USER</option>
                                    <option value="ADMIN">ADMIN</option>

                                </select>
                            </div>

                        </div>

                        <div class="mb-4">

                            <label for="adresseLivraison" class="form-label fw-semibold">
                                Adresse
                            </label>

                            <textarea id="adresseLivraison"
                                      th:field="*{adresseLivraison}"
                                      class="form-control"
                                      rows="3"></textarea>
                        </div>

                        <button type="submit" class="btn btn-success">
                            Créer utilisateur
                        </button>

                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
